(function(){

const subs=new Map();let timer=null,busy=false,first=true,kt=null;
const snap=rows=>({docs:rows.map(d=>({id:d.id,data:()=>{const o={...d};delete o.id;return o}}))});
async function poll(){if(busy)return;busy=true;try{const cols=[...subs.keys()];if(!cols.length)return;const r=await api({op:"list",cols});subs.forEach((l,c)=>{if(r[c])l.forEach(x=>x.ok(snap(r[c])))});first=false}catch(e){if(first||e.status===401||e.status===403)subs.forEach(l=>l.forEach(x=>x.err&&x.err(e)))}finally{busy=false}}
function kick(){setTimeout(poll,250);setTimeout(poll,1500)}
const db={collection:c=>({
onSnapshot(ok,err){(subs.get(c)||subs.set(c,[]).get(c)).push({ok,err});clearTimeout(kt);kt=setTimeout(poll,0);if(!timer)timer=setInterval(()=>{if(!document.hidden)poll()},5000);return()=>{}},
add:async v=>{const r=await api({op:"add",c,v});kick();return r},
doc:id=>({update:async p=>{await api({op:"update",c,id,patch:p});kick()},set:async v=>{await api({op:"set",c,id,v});kick()},get:async()=>{const d=await api({op:"get",c,id});return{exists:!!d,data:()=>d||{}}}})
}),doc:p=>{const a=p.split("/");return db.collection(a[0]).doc(a[1])}};
window.claude={use:async n=>{
if(n==="user"){if(!INIT)throw new Error("Saytni Telegramda, bot orqali oching");const me=await api({op:"me"});return{id:async()=>me.id,isOwner:async()=>me.owner,profiles:ids=>api({op:"profiles",ids})}}

return null}};
})();

<script>

function periodBar(){return `<div class="pb"><select id="pp">${[["kun","Kunlik"],["oy","Oylik"],["yil","Yillik"]].map(x=>`<option value="${x[0]}" ${P==x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><input type="date" id="pd" value="${BD}"></div>`}

 <div class="card"><div class="frm" data-f="mijoz"><div>${field("ism","Yangi mijoz ismi")}</div>${selF("hud","Hudud",["Qoʻqon","Abu Saxiy"])}${field("tel","Telefon","tel")}<div style="align-self:end"><button class="btn" data-add>+ Mijoz</button></div></div></div>

 return r.length?r.map(c=>`<div class="row" data-cl="${c.id}" style="cursor:pointer"><div><b>${E(c.ism)}</b><br><small>${E(c.tel||"")}</small></div><b class="${cls(c.b)}">${c.b>0?"Qarz: ":c.b<0?"Avans: ":""}${F(Math.abs(c.b))}</b></div>`).join(""):'<div class="k">Mijoz topilmadi</div>'}

 const a=S.amal.filter(x=>x.mijoz==CL).sort((p,q)=>(q.sana||"").localeCompare(p.sana)||q.t-p.t),b=bal(CL);
 const per=a.filter(x=>inP(x.sana));
 if(AK)return pAkt(c);return `<button class="btn s" data-back>← Mijozlar</button> <button class="btn" data-akt>📄 Akt sverka</button>${ADM?` <button class="btn s" data-edc="${c.id}">✎ Tahrirlash</button> ${DEL=="C"+c.id?'<button class="btn d" data-delc>Ha, oʻchir</button>':'<button class="btn s" data-askc>🗑 Oʻchirish</button>'}`:""}<div class="card"><h2 style="margin:0">${E(c.ism)}</h2><small>${E(c.tel||"")}${c.hud?" · "+E(c.hud):""}</small>
 <div class="grid" style="margin-top:8px"><div><div class="k">Jami yuk haqi</div><div class="v">${F(sum(a.filter(x=>x.tur=="yuk"&&x.holat!="bekor")))}</div></div><div><div class="k">Jami toʻlov</div><div class="v g">${F(sum(a.filter(x=>x.tur!="yuk")))}</div></div><div><div class="k">${b<0?"Avans":"Qarz (nasiya)"}</div><div class="v ${cls(b)}">${F(Math.abs(b))}</div></div></div></div>
